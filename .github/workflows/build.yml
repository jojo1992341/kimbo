name: Build Windows exe

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Cargo.toml
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse -Filter Cargo.toml -File |
               Where-Object { $_.FullName -notmatch '[\\/]target[\\/]' } |
               Select-Object -First 1
          if (-not $f) {
            Write-Host "::error::Aucun Cargo.toml dans le depot. Pousse aussi Cargo.toml et le dossier src/ (pas seulement .github)."
            Get-ChildItem -Recurse -File | Select-Object -ExpandProperty FullName
            exit 1
          }
          Write-Host "Projet trouve dans : $($f.DirectoryName)"
          "PROJECT_DIR=$($f.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check source layout
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if (-not (Test-Path src/main.rs)) {
            if (Test-Path main.rs) {
              Write-Host "main.rs trouve a la racine : deplacement dans src/"
              New-Item -ItemType Directory -Force src | Out-Null
              Move-Item main.rs src/main.rs
              if (Test-Path logic.rs) { Move-Item logic.rs src/logic.rs }
            } else {
              Write-Host "::error::src/main.rs est introuvable. Fichiers presents :"
              Get-ChildItem -Recurse -File | Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } | Select-Object -ExpandProperty FullName
              exit 1
            }
          }

      - name: Check icon files
        shell: pwsh
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          foreach ($f in @("build.rs", "assets/icon.ico", "assets/icon_64.rgba", "assets/terre.rgba", "assets/air.rgba", "assets/eau.rgba", "assets/feu.rgba", "assets/pousser.rgba")) {
            if (-not (Test-Path $f)) {
              Write-Host "::error::Fichier manquant dans le depot : $f (a placer a cote de Cargo.toml)"
              $missing = $true
            }
          }
          if ($missing) { exit 1 }
          if (-not (Select-String -Path Cargo.toml -Pattern "winresource" -Quiet)) {
            Write-Host "::error::Cargo.toml ne contient pas [build-dependencies] winresource"
            exit 1
          }

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.PROJECT_DIR }}

      - name: Tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo test --release

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: cargo build --release

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: kimbo-windows
          path: ${{ env.PROJECT_DIR }}/target/release/kimbo.exe

      - name: Publish release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/target/release/kimbo.exe
