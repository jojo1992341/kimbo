[package]
name = "kimbo"
version = "1.0.0"
edition = "2021"
description = "Kimbo : sur quelle couleur de case me placer ?"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["wgpu", "default_fonts"] }
# Active DirectX 12 (le backend OpenGL est activé automatiquement sous Windows par wgpu 24)
wgpu = { version = "24", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
